<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Print a File</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #403a2e;
      background: #fff9e9;
    }

    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; padding: 1rem; place-items: center; }
    main {
      width: min(560px, 100%);
      padding: clamp(1.25rem, 5vw, 2.25rem);
      border: 1px solid #eadfbf;
      border-radius: 24px;
      background: #fffdf6;
      box-shadow: 0 12px 36px rgb(83 69 31 / 10%);
    }

    .label {
      display: inline-block;
      padding: .3rem .75rem;
      border-radius: 999px;
      background: #fff0b8;
      color: #604d14;
      font-size: .9rem;
      font-weight: 700;
    }

    h1 { margin: .8rem 0 .3rem; font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.1; }
    p { line-height: 1.55; }
    .intro { margin: 0; color: #665f50; }
    .picker {
      display: block;
      width: 100%;
      margin-top: 1.4rem;
      padding: 1rem;
      border: 2px dashed #d7c586;
      border-radius: 14px;
      background: #fffaf0;
      font: inherit;
    }

    .file-name {
      min-height: 1.6em;
      margin: .75rem 0 0;
      color: #665f50;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      margin-top: 1rem;
      padding: .9rem 1rem;
      border: 0;
      border-radius: 12px;
      background: #f2cf62;
      color: #403a2e;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }
    button:focus-visible, input:focus-visible { outline: 3px solid #7a621b; outline-offset: 3px; }
    .status { min-height: 1.5em; margin: .8rem 0 0; color: #665f50; font-size: .94rem; }
    .hint { margin: 1.2rem 0 0; color: #706858; font-size: .88rem; }
    #print-frame {
      position: fixed;
      z-index: 10;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: white;
    }

    #print-frame.hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <span class="label">Family printer</span>
    <h1>Print a file</h1>
    <p class="intro">Choose a file, then press Print.</p>
    <input class="picker" id="file" type="file" accept="application/pdf,image/*,text/plain">
    <p class="file-name" id="file-name">No file selected</p>
    <button id="print" type="button" disabled>Choose a file first</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="hint">PDF, image, and plain-text files are supported. Confirm printing in the device’s print dialog if asked.</p>
    <iframe id="print-frame" class="hidden" title="Print document"></iframe>
  </main>

  <script>
    const picker = document.getElementById("file");
    const fileName = document.getElementById("file-name");
    const printButton = document.getElementById("print");
    const status = document.getElementById("status");
    const frame = document.getElementById("print-frame");
    let selectedFile = null;
    let objectUrl = null;

    picker.addEventListener("change", () => {
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = null;
      }
      frame.onload = null;
      frame.removeAttribute("src");
      frame.srcdoc = "";
      frame.classList.add("hidden");
      selectedFile = picker.files[0] || null;
      fileName.textContent = selectedFile ? selectedFile.name : "No file selected";
      printButton.disabled = !selectedFile;
      printButton.textContent = selectedFile ? "Print" : "Choose a file first";
      status.textContent = "";
    });

    printButton.addEventListener("click", () => {
      if (!selectedFile) return;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(selectedFile);
      status.textContent = "";

      const file = selectedFile;
      const type = file.type.toLowerCase();
      const isPdf = type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
      const isImage = type.startsWith("image/");
      const isText = type.startsWith("text/") || file.name.toLowerCase().endsWith(".txt");
      if (!isPdf && !isImage && !isText) {
        status.textContent = "This file type cannot be printed in the browser. Save it as a PDF, then choose the PDF.";
        return;
      }

      const startPrint = () => {
        if (selectedFile !== file) return;
        try {
          frame.classList.remove("hidden");
          status.textContent = "Opening print dialog…";
          frame.contentWindow.addEventListener("afterprint", () => {
            frame.classList.add("hidden");
            status.textContent = "Print dialog closed.";
          }, { once: true });
          frame.contentWindow.focus();
          frame.contentWindow.print();
        } catch {
          frame.classList.add("hidden");
          status.textContent = "Could not open the print dialog. Try opening the file in another app and printing from there.";
        }
      };

      if (isPdf) {
        frame.onload = () => {
          frame.onload = null;
          setTimeout(startPrint, 500);
        };
        frame.src = objectUrl;
      } else if (isImage) {
        const imageUrl = objectUrl;
        frame.onload = () => {
          frame.onload = null;
          const image = frame.contentDocument.querySelector("img");
          if (!image) {
            status.textContent = "Could not prepare this image for printing.";
            return;
          }
          const printWhenReady = () => setTimeout(startPrint, 100);
          if (image.complete) printWhenReady();
          else image.addEventListener("load", printWhenReady, { once: true });
          image.addEventListener("error", () => {
            status.textContent = "Could not load this image for printing. Please select it again.";
          }, { once: true });
        };
        frame.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><style>@page{margin:10mm}html,body{width:100%;height:100%;margin:0}body{display:grid;place-items:center}img{max-width:100%;max-height:96vh;object-fit:contain}</style></head><body><img src="${imageUrl}" alt=""></body></html>`;
      } else {
        const reader = new FileReader();
        reader.addEventListener("load", () => {
          if (selectedFile !== file) return;
          const escaped = String(reader.result)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;");
          frame.onload = () => {
            frame.onload = null;
            setTimeout(startPrint, 150);
          };
          frame.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><style>@page{margin:15mm}body{font:12pt/1.5 system-ui,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body>${escaped}</body></html>`;
        });
        reader.addEventListener("error", () => {
          status.textContent = "Could not read this file. Please select it again.";
        });
        reader.readAsText(file);
      }
    });

    window.addEventListener("pagehide", () => {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    });
  </script>
</body>
</html>
